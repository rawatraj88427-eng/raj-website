    .container {
      max-width: 700px;

    }

    p {
      font-size: 18px;
      line-height: 1.6;

      padding: 12px 25px;

      color: white;

      border-radius: 30px;
      font-size: 16px;
    }

    .btn:hover {
      background: #005fcc;
    }

      font-size: 14px;
